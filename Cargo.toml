[package]
name = "rupg-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/tamnd/rupg-bench"
description = "The benchmark harness for rupg."
publish = false

# The M1 numbers link the rupg facade at the commit of pins.toml. A test checks that the two commits are the same.
[dependencies]
rupg = { git = "https://github.com/tamnd/rupg", rev = "3c5cb50b9fd4e55106fd698b7b55fb88e1f4108e" }
# The in-memory file system of the instruction count set of M1, from the same commit.
rupg-platform = { git = "https://github.com/tamnd/rupg", rev = "3c5cb50b9fd4e55106fd698b7b55fb88e1f4108e" }
# TLS and SCRAM-SHA-256 for the client of src/pg.rs, with the same crates and features as rupg.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
doc_markdown = "allow"
missing_panics_doc = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
