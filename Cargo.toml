[package]
name = "rupg-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/tamnd/rupg-bench"
description = "The benchmark harness for rupg."
publish = false

# No dependencies yet. The drivers arrive with the milestones. The embedded runs link rupg at a pinned commit from M9.
[dependencies]

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
doc_markdown = "allow"
missing_panics_doc = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
