[package]
name = "rupg-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/tamnd/rupg-bench"
description = "The benchmark harness for rupg."
publish = false

# The M1 numbers link the rupg facade at the commit of pins.toml. A test checks that the two commits are the same.
[dependencies]
rupg = { git = "https://github.com/tamnd/rupg", rev = "aed939c3488f9eae975d957bf85461499069adfd" }

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
doc_markdown = "allow"
missing_panics_doc = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
