name: Harness bug
description: A driver, a loader, a machine script or a report does the wrong thing.
title: "harness: "
labels: ["kind/bug"]
body:
  - type: markdown
    attributes:
      value: |
        This template is for a bug in the harness itself. A slow query in rupg goes to tamnd/rupg with the "Performance" template.
  - type: textarea
    id: what
    attributes:
      label: What occurred
      description: The command, what you expected and what occurred.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: The commit of rupg-bench and the commit of rupg.
    validations:
      required: true
